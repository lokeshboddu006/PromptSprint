<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeContext Hub — One Project. One Source of Truth. Every AI.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#8b5cf6',
                            purpleDark: '#7c3aed',
                            cyan: '#06b6d4',
                            cyanDark: '#0891b2',
                            darkBg: '#09090b',
                            cardBg: '#18181b',
                            border: '#27272a',
                            textMuted: '#a1a1aa'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #09090b;
            color: #fafafa;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        .glass-panel {
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(39, 39, 42, 0.6);
        }
        .glow-purple {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
        }
        .glow-cyan {
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
        }
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(139, 92, 246, 0.3); }
            50% { border-color: rgba(6, 182, 212, 0.8); }
        }
        .anim-border {
            animation: pulse-border 3s infinite;
        }
    </style>
  </head>
  <body class="selection:bg-brand-purple/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
